<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Extra Activities Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            text-align: center;
            padding: 35px 20px 25px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            color: #6b7280;
            max-width: 500px;
            margin: auto;
            line-height: 1.5;
        }

        .form-container {
            width: 100%;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .form-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        iframe {
            width: 100%;
            min-height: 850px;
            border: none;
            display: block;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #9ca3af;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .header {
                padding: 25px 15px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .form-container {
                margin: 15px auto;
                padding: 0;
            }

            .form-card {
                border-radius: 0;
                box-shadow: none;
            }

            iframe {
                min-height: 900px;
            }

        }
    </style>
</head>

<body>

    <header class="header">

        <h1>Extra Activities</h1>

        <p>
            Register your interest in participating in
            additional activities.
        </p>

    </header>


    <main class="form-container">

        <div class="form-card">

            <iframe
                src="https://forms.gle/gL7BdWEndEuQbH2EA">

            </iframe>

        </div>

    </main>


    <footer class="footer">

        Please submit the form only once.

    </footer>

</body>

</html>
