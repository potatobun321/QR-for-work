<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Extra Activities Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc
            );

            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 480px;

            background: white;

            padding: 45px 30px;

            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.12);
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #111827;

            color: white;

            font-size: 30px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #6b7280;

            line-height: 1.6;

            margin-bottom: 30px;

            font-size: 16px;
        }

        .continue-btn {
            display: block;

            width: 100%;

            padding: 16px;

            border-radius: 12px;

            background: #111827;

            color: white;

            text-decoration: none;

            font-size: 16px;
            font-weight: bold;

            transition: 0.2s;
        }

        .continue-btn:hover {
            background: #374151;

            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;

            font-size: 13px;

            color: #9ca3af;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="icon">
            +
        </div>

        <h1>Extra Activities</h1>

        <p>
            Interested in participating in additional
            activities? Fill out the short registration
            form below.
        </p>

        <a
            href="https://forms.gle/gL7BdWEndEuQbH2EA"
            class="continue-btn">

            Register Now

        </a>

        <div class="footer">

            Please submit your details only once.

        </div>

    </div>

</body>

</html>
