<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Extra Activities</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f3f4f6;
        }

        .popup {
            width: 90%;
            max-width: 420px;

            background: white;

            padding: 35px 25px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            font-size: 26px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .continue-btn {
            display: block;

            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #111;
            color: white;

            font-size: 16px;
            font-weight: bold;

            text-decoration: none;

            cursor: pointer;
        }

        .continue-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="popup">

        <h1>Extra Activities</h1>

        <p>
            Please fill out this short form to let us know
            whether you are interested in participating
            in extra activities.
        </p>

        <a
            href="https://forms.gle/uypCd3KX7SC2roV27"
            class="continue-btn">

            Continue to Form

        </a>

    </div>

</body>

</html>
